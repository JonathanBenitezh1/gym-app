<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{GYM_DESCRIPCION}}" />
    <meta name="theme-color" content="{{GYM_COLOR_TEMA}}" />
    <!-- La conexión con la API (TLS incluido) se abre mientras carga la app, y
         no recién con el primer pedido: medio segundo menos en el celular. -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Barra de estado negra aparte, arriba de la app. Con "black-translucent"
         la app quedaba debajo del reloj (sin viewport-fit=cover el encabezado
         se tapaba) y en modo claro la letra blanca no se leía sobre el fondo
         blanco (auditoría del 04/10/2026). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="{{GYM_NOMBRE_CORTO}}" />
    <title>{{GYM_NOMBRE}}</title>
    <!-- Modo claro u oscuro antes de dibujar nada (public/tema.js). -->
    <script src="/tema.js"></script>
    <!-- Pantalla de arranque: se ve mientras baja la app, en vez de una
         pantalla vacía. React la reemplaza al dibujar la primera pantalla. -->
    <style>
      /* Los mismos colores que --color-fondo y --color-acento de src/index.css. */
      html, body { background: #1b1d20; margin: 0; }
      .arranque { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
      .arranque img { width: 88px; height: 88px; border-radius: 22px; }
      .arranque-puntos { display: flex; gap: 8px; }
      .arranque-puntos span { width: 9px; height: 9px; border-radius: 50%; background: #eeeeee; opacity: .25; animation: arranque 1.2s infinite ease-in-out; }
      .arranque-puntos span:nth-child(2) { animation-delay: .15s; }
      .arranque-puntos span:nth-child(3) { animation-delay: .3s; }
      @keyframes arranque { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .arranque-puntos span { animation: none; opacity: .6; } }
      /* Modo claro: los mismos colores que en src/index.css. */
      html[data-tema='claro'], html[data-tema='claro'] body { background: #f2f3f5; }
      html[data-tema='claro'] .arranque-puntos span { background: #1b1d20; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="arranque" role="status" aria-label="Cargando">
        <img src="/icons/icon-192.png" alt="" />
        <div class="arranque-puntos"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
